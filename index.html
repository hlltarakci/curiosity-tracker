<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Small World of Curiosity — Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2329;--muted:#66707a;--line:#e3e6ea;--accent:#1f883d;--hover:#f0f2f4;--danger:#cf222e;--link:#0969da}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--text:#e6e9ec;--muted:#8b949e;--line:#2a3038;--accent:#2ea043;--hover:#1f252c;--danger:#f85149;--link:#58a6ff}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;white-space:nowrap}
#menuBtn{display:none}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:270px 1fr;max-width:1200px;margin:0 auto}
nav{border-right:1px solid var(--line);height:calc(100vh - 53px);overflow:auto;position:sticky;top:53px;padding:12px}
nav input{margin-bottom:8px}
nav .area{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:500;margin-top:2px}
nav .area:hover,nav .d:hover,nav .f:hover{background:var(--hover)}
nav .area.active{background:var(--card);border:1px solid var(--line)}
nav .area.cur{font-weight:600}
nav .ic{width:22px;text-align:center}
nav .car{color:var(--muted);font-size:11px;width:12px;display:inline-block}
nav .car.r{margin-left:auto}
nav .kids{margin:2px 0 8px 22px;border-left:1px solid var(--line)}
nav .d{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--text);display:flex;gap:6px;align-items:center}
nav .f{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
nav .f.active{background:var(--card);border:1px solid var(--line);font-weight:600}
nav .hist,nav .f.hist{color:var(--muted)}
main{padding:20px;min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar .path{color:var(--muted);font-size:13px}
.bar .links{margin-left:auto;font-size:13px;display:flex;gap:12px;align-items:center}
.stats{font-size:13px;color:var(--muted)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.h{margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.h:first-child{margin-top:4px}
.h1{font-size:21px}.h2{font-size:17px}.h3,.h4,.h5,.h6{font-size:15px}
.h .add{opacity:0;font-size:12px;padding:2px 8px}
.h:hover .add,.h .add:focus{opacity:1}
.row{display:flex;align-items:flex-start;gap:8px;padding:3px 4px;border-radius:6px}
.row:hover{background:var(--hover)}
.row input[type=checkbox]{margin-top:4px;width:16px;height:16px;flex:none;cursor:pointer}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done>.t{color:var(--muted)}
.row .tools{opacity:0;display:flex;gap:2px}
.row:hover .tools{opacity:1}
.row .tools button{border:none;background:none;padding:0 5px;color:var(--muted)}
.bullet{width:16px;flex:none;text-align:center;color:var(--muted)}
.p{padding:3px 4px;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:6px 0}
table{border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
.addform{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.addform input{flex:1;min-width:200px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
select{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.stack{display:grid;gap:12px;max-width:460px}
.muted{color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:10;max-width:90vw}
.toast a{color:inherit;font-weight:600;margin-left:8px}
.toast.err{background:var(--danger);color:#fff}
.busy{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:100%;animation:b 1s linear infinite;display:none;z-index:20}
@keyframes b{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
code{background:var(--hover);padding:1px 5px;border-radius:5px;font-size:13px}
.switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.switch input{width:auto}
.sm{display:none}
.qwrap{position:relative;flex:1;max-width:560px;margin-left:12px}
.qwrap input{padding-right:44px}
.qwrap input:not(:placeholder-shown)+kbd{display:none}
.qwrap kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:12px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;pointer-events:none}
.sres{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sres .fh{display:flex;gap:8px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--hover)}
.sres .fh b{font-size:15px}
.sres .hit{display:flex;gap:8px;align-items:flex-start;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sres .hit:last-child{border-bottom:none}
.sres .hit:hover{background:var(--hover)}
.sres .hit input{margin-top:4px;width:16px;height:16px;flex:none}
.sres .hit .ctx{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sres .hit.done .t{color:var(--muted)}
.sres .more{padding:8px 14px;font-size:13px}
mark{background:#fff3a3;color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme:dark){mark{background:#6b5b00}}
.flash{animation:fl 2s ease-out}
@keyframes fl{0%,40%{background:#fff3a3}100%{background:transparent}}
.askbox{margin-bottom:14px}
.askrow{display:flex;gap:8px}
.askrow input{font-size:16px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg)}
.askintro{font-size:15px;margin:4px 2px 10px}
.card{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card input[type=checkbox]{margin-top:4px;width:18px;height:18px;flex:none}
.card .cb{flex:1;min-width:0;overflow-wrap:anywhere}
.card .ctx2{font-size:12px;color:var(--muted);margin-bottom:2px}
.card .why{color:var(--muted);font-size:14px;margin-top:3px}
.card .where{font-size:12px;display:inline-block;margin-top:4px}
.card.idea button{margin-top:6px;font-size:13px}
.ideash{font-size:15px;margin:18px 2px 8px}
.help{font-size:13px;color:var(--muted);margin:4px 0 14px}
.help code{font-size:12px}
@media (max-width:800px){
  .layout{grid-template-columns:1fr}
  #menuBtn{display:inline-block}
  nav{display:none;position:fixed;inset:53px 0 0 0;background:var(--bg);z-index:6;height:auto;border:none}
  nav.open{display:block}
  main{padding:12px}
  .row .tools{opacity:1}
  .h .add{opacity:1}
  header h1{display:none}
  .lg{display:none}
  .sm{display:inline}
  .qwrap{margin-left:0;max-width:none}
  .spacer{display:none}
  .qwrap kbd{display:none}
}
</style>
</head>
<body>
<div class="busy" id="busy"></div>
<header>
  <button id="menuBtn">☰</button>
  <h1>Curiosity Tracker</h1>
  <div class="qwrap"><input id="q" type="search" placeholder="Search everything…" autocomplete="off"><kbd id="kbdHint">⌘K</kbd></div>
  <button id="askBtn" title="Ask for suggestions">✨ <span class="lg">Ask</span></button>
  <span class="spacer"></span>
  <button id="settingsBtn" title="Settings"><span class="lg">Settings</span><span class="sm">⚙</span></button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== config & state =====
const KEY = 'curiosityTracker.cfg';
const DEFAULTS = {owner:'hlltarakci', repo:'my_small_world_of_curiosity_with_ai', branch:'main', token:'', hideDone:false};
let cfg = Object.assign({}, DEFAULTS, loadJSON(KEY));
let files = [];        // paths of .md files
let cur = null;        // {path, text, sha}
let view = 'file';     // file | settings
let addAt = null;      // heading line index with open add form
let editAt = null;     // line index being edited
let filter = '';
let fileSha = {};       // path -> blob sha (from tree)
let jumpLine = null;     // line to scroll to after opening
let query = '', lastView = 'file';

function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k)) || {}; }catch(e){ return {}; } }
function store(){ try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ready = () => cfg.owner && cfg.repo && cfg.token;

// ===== GitHub API =====
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const repoUrl = () => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;
async function gh(path, opts = {}){
  const r = await fetch('https://api.github.com' + path, {...opts, cache:'no-store', headers:{
    Authorization:'Bearer ' + cfg.token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28',
    ...(opts.body ? {'Content-Type':'application/json'} : {})}});
  if(!r.ok){
    let msg = r.status + ''; try{ msg = (await r.json()).message || msg; }catch(e){}
    const e = new Error(r.status === 401 ? 'Token rejected. Check Settings.' : r.status === 404 ? 'Not found (check repo name and token access).' : 'GitHub: ' + msg);
    e.status = r.status; throw e;
  }
  return r.json();
}
const b64enc = s => { const b = new TextEncoder().encode(s); let x = ''; for(let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(x); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
async function listFiles(){
  const t = await gh(`${repoUrl()}/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
  const md = t.tree.filter(i => i.type === 'blob' && /\.md$/i.test(i.path));
  fileSha = Object.fromEntries(md.map(i => [i.path, i.sha])); treeAt = Date.now();
  return md.map(i => i.path);
}
async function getFile(path){
  const f = await gh(`${repoUrl()}/contents/${encPath(path)}?ref=${encodeURIComponent(cfg.branch)}`);
  if(f.content === '' && f.size > 0){            // > 1 MB: fetch blob
    const b = await gh(`${repoUrl()}/git/blobs/${f.sha}`); return {text: b64dec(b.content), sha: f.sha};
  }
  return {text: b64dec(f.content), sha: f.sha};
}
async function putFile(path, text, sha, message){
  return gh(`${repoUrl()}/contents/${encPath(path)}`, {method:'PUT', body: JSON.stringify({message, content: b64enc(text), sha, branch: cfg.branch})});
}

// ===== markdown model =====
const CHECK = /^(\s*)([-*+])\s+\[( |x|X)\]\s+(.*)$/;
const BULLET = /^(\s*)([-*+]|\d+\.) (.*)$/;
const HEAD = /^(#{1,6})\s+(.*)$/;
const indentOf = l => l.match(/^\s*/)[0].replace(/\t/g, '    ').length;

// Ops find their line by content (+ occurrence), so they survive edits made elsewhere.
function locate(L, line, occ){
  let n = -1;
  for(let i = 0; i < L.length; i++) if(L[i] === line && ++n === occ) return i;
  throw new Error('That line changed on GitHub. Reloaded — try again.');
}
function occurrence(L, idx){ let n = 0; for(let i = 0; i < idx; i++) if(L[i] === L[idx]) n++; return n; }
const opSet = (line, occ, newLine) => text => {
  const L = text.split('\n'), i = locate(L, line, occ);
  if(newLine == null){             // delete line and its nested children
    const ind = indentOf(L[i]); let e = i + 1;
    while(e < L.length && L[e].trim() !== '' && indentOf(L[e]) > ind && !HEAD.test(L[e])) e++;
    L.splice(i, e - i);
  } else L[i] = newLine;
  return L.join('\n');
};
const opAdd = (head, occ, item, where) => text => {
  const L = text.split('\n');
  let h = head == null ? -1 : locate(L, head, occ);
  const level = h >= 0 ? L[h].match(HEAD)[1].length : 0;
  let end = h + 1;
  while(end < L.length){ const m = L[end].match(HEAD); if(m && (h < 0 || m[1].length <= level)) break; end++; }
  const line = '- [ ] ' + item.replace(/\r?\n/g, ' ');
  if(where === 'top'){
    let i = h + 1;
    while(i < end && !CHECK.test(L[i]) && !BULLET.test(L[i])) i++;
    if(i === end){ i = h + 1; }
    L.splice(i, 0, line);
  } else {
    let i = end; while(i > h + 1 && L[i - 1].trim() === '') i--;
    L.splice(i, 0, line);
  }
  return L.join('\n');
};

async function commit(op, message){
  setBusy(true);
  try{
    let text = op(cur.text), res;
    try{ res = await putFile(cur.path, text, cur.sha, message); }
    catch(e){
      if(e.status !== 409 && e.status !== 422) throw e;   // changed elsewhere: reload, re-apply once
      Object.assign(cur, await getFile(cur.path));
      text = op(cur.text);
      res = await putFile(cur.path, text, cur.sha, message);
    }
    cur.text = text; cur.sha = res.content.sha; addAt = editAt = null;
    fileSha[cur.path] = cur.sha; cache.set(cur.path, {sha: cur.sha, text}); idbPut(cur.sha, text);
    toast('Committed', res.commit.html_url);
  }catch(e){
    toast(e.message, null, true);
    if(/changed on GitHub/.test(e.message)){ try{ Object.assign(cur, await getFile(cur.path)); }catch(_){} }
  }
  setBusy(false); render();
}

// ===== inline markdown =====
let linkBase = null;
function resolveRel(href){
  const base = (linkBase || cur.path).split('/').slice(0, -1);
  for(const part of decodeURIComponent(href).split('/')){
    if(part === '..') base.pop(); else if(part && part !== '.') base.push(part);
  }
  return base.join('/');
}
function inline(s, base){
  if(base !== undefined){ const prev = linkBase; linkBase = base; try{ return inline(s); } finally { linkBase = prev; } }
  // swap links for placeholders, format the rest, then put links back (so **[x](y)** works)
  const keep = [];
  const re = /\[((?:[^\[\]]|\[[^\]]*\])*)\]\(([^()\s]*(?:\([^()]*\)[^()\s]*)*)\)|(https?:\/\/[^\s<>)\]]+)/g;
  let t = s.replace(re, (m, label, href, bare) => {
    let tail = '';
    if(bare){ const m2 = bare.match(/[*.,;:!]+$/); if(m2){ tail = m2[0]; bare = bare.slice(0, -tail.length); } }
    keep.push(bare ? `<a href="${esc(bare)}" target="_blank" rel="noopener">${esc(bare)}</a>` : link(href, inline(label)));
    return `\u0000${keep.length - 1}\u0000` + tail;
  });
  t = fmt(esc(t));
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function link(href, label){
  if(/^https?:/i.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
  const [p, anchor] = href.split('#'); const target = resolveRel(p);
  if(/\.md$/i.test(target) && files.includes(target)) return `<a href="#" data-open="${esc(target)}">${label}</a>`;
  if(target && files.includes(target + '/README.md')) return `<a href="#" data-open="${esc(target + '/README.md')}">${label}</a>`;
  const gh = `https://github.com/${cfg.owner}/${cfg.repo}/${/\.\w+$/.test(target) ? 'blob' : 'tree'}/${cfg.branch}/${encPath(target)}${anchor ? '#' + anchor : ''}`;
  return `<a href="${esc(gh)}" target="_blank" rel="noopener">${label}</a>`;
}
const fmt = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
const plain = s => s.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*`]/g, '').replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim();
const short = s => { s = plain(s) || 'item'; return s.length > 50 ? s.slice(0, 50) + '…' : s; };

// ===== rendering =====
let toastTimer;
function toast(msg, href, err){
  const t = $('toast');
  t.innerHTML = esc(msg) + (href ? `<a href="${esc(href)}" target="_blank" rel="noopener">View commit</a>` : '');
  t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', err ? 7000 : 3000);
}
function setBusy(b){ $('busy').style.display = b ? 'block' : 'none'; document.querySelectorAll('main button, main input[type=checkbox]').forEach(x => x.disabled = b); }
const isHist = p => /(^|\/)history\//.test(p);
const title = p => { const t = p.split('/').pop().replace(/\.md$/i, '').replace(/^README$/i, 'Overview').replace(/[-_]+/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1); };

const ICONS = {russian:'🇷🇺', exercise:'🏃', books:'📚', watch:'🎬', podcasts:'🎧', intellectual:'🧠', courses:'🎓', work:'💼', health:'🩺', cooking:'🍳', photography:'📷', misc:'🌱'};
let openDirs = new Set(loadJSON(KEY + '.open').dirs || []);
function saveOpen(){ try{ localStorage.setItem(KEY + '.open', JSON.stringify({dirs: [...openDirs]})); }catch(e){} }
const cap = t => t.charAt(0).toUpperCase() + t.slice(1).replace(/[-_]+/g, ' ');
function buildTree(paths){
  const root = {dirs:{}, files:[]};
  paths.forEach(p => { const parts = p.split('/'); let n = root;
    parts.slice(0, -1).forEach((d, i) => { n = n.dirs[d] = n.dirs[d] || {dirs:{}, files:[], path: parts.slice(0, i + 1).join('/')}; });
    n.files.push(p); });
  return root;
}
function navNode(node, depth){
  const files = node.files.slice().sort((a, b) => /README\.md$/.test(b) - /README\.md$/.test(a) || a.localeCompare(b));
  const dirs = Object.keys(node.dirs).sort((a, b) => (a === 'history') - (b === 'history') || a.localeCompare(b));
  let h = files.map(p => `<div class="f ${cur && cur.path === p ? 'active' : ''} ${isHist(p) ? 'hist' : ''}" style="padding-left:${12 + depth * 14}px" data-open="${esc(p)}" title="${esc(p)}">${esc(title(p))}</div>`).join('');
  h += dirs.map(d => { const n = node.dirs[d], o = openDirs.has(n.path);
    return `<div class="d ${d === 'history' ? 'hist' : ''}" style="padding-left:${12 + depth * 14}px" data-dir="${esc(n.path)}"><span class="car">${o ? '▾' : '▸'}</span>${esc(cap(d))}</div>` + (o ? navNode(n, depth + 1) : ''); }).join('');
  return h;
}
function renderNav(){
  const nav = $('nav');
  if(!ready()){ nav.innerHTML = ''; return; }
  let h = `<input id="search" placeholder="Find a file…" value="${esc(filter)}">`;
  if(filter){
    const q = filter.toLowerCase();
    h += files.filter(p => p.toLowerCase().includes(q)).map(p => `<div class="f ${cur && cur.path === p ? 'active' : ''}" data-open="${esc(p)}"><span class="muted">${esc(p.split('/').slice(0, -1).join(' / '))}</span><br>${esc(title(p))}</div>`).join('') || '<div class="muted" style="padding:8px">No match</div>';
  } else {
    const tree = buildTree(files);
    if(tree.files.includes('README.md')) h += `<div class="area ${cur && cur.path === 'README.md' ? 'active' : ''}" data-open="README.md"><span class="ic">🏠</span>Home</div>`;
    h += Object.keys(tree.dirs).sort().map(d => { const n = tree.dirs[d], o = openDirs.has(n.path), on = cur && cur.path.startsWith(d + '/');
      return `<div class="area ${on ? 'cur' : ''}" data-dir="${esc(d)}"><span class="ic">${ICONS[d] || '📁'}</span>${esc(cap(d))}<span class="car r">${o ? '▾' : '▸'}</span></div>` + (o ? `<div class="kids">${navNode(n, 0)}</div>` : ''); }).join('');
  }
  nav.innerHTML = h;
  const s = $('search'); s.oninput = e => { filter = e.target.value; renderNav(); const n = $('search'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}
function render(){
  renderNav();
  const m = $('main');
  if(view === 'settings' || !ready()) return renderSettings(m);
  if(view === 'search') return renderSearch(m);
  if(view === 'ask') return renderAsk(m);
  if(!cur){ m.innerHTML = '<div class="doc muted">Pick a file on the left.</div>'; return; }

let treeAt = 0;
const cache = new Map();           // path -> {sha, text}
let idb = null;
function idbOpen(){
  if(idb !== null) return idb;
  idb = new Promise(res => {
    try{ const r = indexedDB.open('curiosityTracker', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('blobs');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch(e){ res(null); }
  });
  return idb;
}
async function idbGet(sha){ const db = await idbOpen(); if(!db) return null;
  return new Promise(res => { try{ const q = db.transaction('blobs').objectStore('blobs').get(sha); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }catch(e){ res(null); } }); }
async function idbPut(sha, text){ const db = await idbOpen(); if(!db) return;
  try{ db.transaction('blobs', 'readwrite').objectStore('blobs').put(text, sha); }catch(e){} }

let indexing = null;
function progress(d, t){ const el = document.getElementById('sprog'); if(el) el.textContent = `Loading your files for search… ${d}/${t}`; }
function ensureIndex(){
  if(!indexing) indexing = buildIndex().finally(() => { indexing = null; });
  return indexing;
}
async function buildIndex(){
  if(Date.now() - treeAt > 60000){ try{ files = await listFiles(); }catch(e){} }
  const work = files.filter(p => !cache.has(p) || cache.get(p).sha !== fileSha[p]);
  let done = files.length - work.length; progress(done, files.length);
  async function worker(){
    while(work.length){
      const p = work.shift(), sha = fileSha[p];
      try{
        let text = await idbGet(sha);
        if(text == null){ const b = await gh(`${repoUrl()}/git/blobs/${sha}`); text = b64dec(b.content); idbPut(sha, text); }
        cache.set(p, {sha, text});
      }catch(e){}
      progress(++done, files.length);
    }
  }
  await Promise.all(Array.from({length: 8}, worker));
}

// Loose matching: case, accents, ё/е, ı/i, İ/i
const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '');
function parseQuery(q){
  const out = {terms: [], not: [], is: null, in: []};
  const re = /(-?)(?:(is|in):)?(?:"([^"]+)"|(\S+))/gi; let m;
  while((m = re.exec(q))){
    const val = (m[3] || m[4] || '').trim(); if(!val) continue;
    const key = (m[2] || '').toLowerCase();
    if(key === 'is'){ const v = val.toLowerCase(); out.is = /^(open|todo|undone)$/.test(v) ? 'open' : /^(done|checked)$/.test(v) ? 'done' : out.is; continue; }
    if(key === 'in'){ out.in.push(norm(val)); continue; }
    (m[1] ? out.not : out.terms).push(norm(val));
  }
  return out;
}
const visible = l => l.replace(/\]\([^)]*\)/g, ']');   // text without link targets
function search(q){
  const Q = parseQuery(q); if(!Q.terms.length && !Q.is && !Q.in.length) return [];
  const results = [];
  for(const [path, {text}] of cache){
    if(!fileSha[path]) continue;
    const np = norm(path);
    if(Q.in.length && !Q.in.every(t => np.includes(t))) continue;
    const L = text.split('\n'); let heading = ''; const hits = []; let score = 0;
    const pathHit = Q.terms.length && Q.terms.every(t => np.includes(t));
    L.forEach((l, i) => {
      const h = l.match(HEAD); if(h) heading = h[2];
      if(!l.trim()) return;
      const c = l.match(CHECK);
      if(Q.is && (!c || (Q.is === 'open') !== (c[3] === ' '))) return;
      const nv = norm(visible(l)), nl = norm(l), nh = norm(heading);
      if(Q.not.some(t => nl.includes(t))) return;
      if(Q.terms.length){
        if(!Q.terms.some(t => nl.includes(t))) return;                   // at least one term on the line
        if(!Q.terms.every(t => nl.includes(t) || nh.includes(t) || np.includes(t))) return;
      }
      let sc = 1;
      for(const t of Q.terms){ if(nv.includes(t)) sc += 2; if(new RegExp('(^|[^\\p{L}\\p{N}])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'u').test(nv)) sc += 1; }
      if(h) sc += 3; if(c && c[3] === ' ') sc += 0.5;
      hits.push({i, line: l, heading: h ? '' : heading, sc}); score = Math.max(score, sc);
    });
    if(hits.length || pathHit) results.push({path, hits, score: score + Math.min(hits.length, 20) * 0.05 + (pathHit ? 6 : 0)});
  }
  return results.sort((a, b) => b.score - a.score || a.path.localeCompare(b.path));
}

let expanded = new Set();
function renderSearch(m){
  if(indexing){ m.innerHTML = `<div class="doc muted" id="sprog">Loading your files for search…</div>`; return; }
  const Q = parseQuery(query), res = search(query);
  const total = res.reduce((n, r) => n + r.hits.length, 0);
  let h = `<div class="bar"><span class="stats"><b>${total}</b> match${total === 1 ? '' : 'es'} in <b>${res.length}</b> file${res.length === 1 ? '' : 's'} · searched ${cache.size} files</span>
    <span class="links"><a href="#" id="closeSearch">Close search</a></span></div>
    <div class="help">Tips: <code>max podcast</code> all words · <code>"exact phrase"</code> · <code>-word</code> exclude · <code>is:open</code> / <code>is:done</code> · <code>in:russian</code> limit to a folder</div>`;
  if(!res.length) h += `<div class="doc muted">No results.</div>`;
  for(const r of res.slice(0, 60)){
    const show = expanded.has(r.path) ? r.hits : r.hits.slice(0, 6);
    const label = /README\.md$/i.test(r.path) && r.path.includes('/') ? cap(r.path.split('/').slice(-2, -1)[0]) : title(r.path);
    h += `<div class="sres"><div class="fh" data-open="${esc(r.path)}"><b>${esc(label)}</b><span class="muted">${esc(r.path)} · ${r.hits.length}</span></div>`;
    for(const x of show){
      const c = x.line.match(CHECK), hd = x.line.match(HEAD), b = x.line.match(BULLET);
      const raw = (hd ? hd[2] : c ? c[4] : b ? b[3] : x.line).trim();
      let body = hd ? `<b>${inline(raw, r.path)}</b>` : inline(raw, r.path);
      const pl = plain(raw);
      if(pl.length > 260){                         // long paragraph: show a snippet around the first match
        const npl = norm(pl); let at = Math.min(...Q.terms.map(t => { const k = npl.indexOf(t); return k < 0 ? Infinity : k; }));
        if(!isFinite(at)) at = 0;
        const a = Math.max(0, at - 100), z = Math.min(pl.length, at + 160);
        body = (a ? '… ' : '') + esc(pl.slice(a, z)) + (z < pl.length ? ' …' : '');

        + (c ? `<input type="checkbox" data-stoggle="${esc(r.path)}" data-ln="${x.i}" ${c[3] !== ' ' ? 'checked' : ''}>` : '')
        + `<span class="t">${body}${x.heading ? `<span class="ctx">in ${esc(plain(x.heading))}</span>` : ''}</span></div>`;
    }
    if(r.hits.length > show.length) h += `<div class="more"><a href="#" data-more="${esc(r.path)}">Show all ${r.hits.length} in this file</a></div>`;
    h += `</div>`;
  }
  if(res.length > 60) h += `<div class="muted">Showing the top 60 files. Add more words to narrow it down.</div>`;
  m.innerHTML = h;
  m.querySelectorAll('.hit .t').forEach(el => highlight(el, Q.terms));
}

// Wrap matches in <mark>, matching the same loose way as search
function highlight(root, terms){
  if(!terms || !terms.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const n of nodes){
    const s = n.nodeValue; let ns = '', map = [];
    for(let i = 0; i < s.length; i++){ const k = norm(s[i]); for(let j = 0; j < k.length; j++){ ns += k[j]; map.push(i); } }
    const spans = [];
    for(const t of terms){ let at = 0; while(t && (at = ns.indexOf(t, at)) >= 0){ spans.push([map[at], map[at + t.length - 1] + 1]); at += t.length; } }
    if(!spans.length) continue;
    spans.sort((a, b) => a[0] - b[0]); const merged = [];
    for(const sp of spans){ const l = merged[merged.length - 1]; if(l && sp[0] <= l[1]) l[1] = Math.max(l[1], sp[1]); else merged.push(sp.slice()); }
    const frag = document.createDocumentFragment(); let last = 0;
    for(const [a, b] of merged){ frag.append(s.slice(last, a)); const mk = document.createElement('mark'); mk.textContent = s.slice(a, b); frag.append(mk); last = b; }
    frag.append(s.slice(last)); n.replaceWith(frag);
  }
}

const ASK_STOP = new Set('a an the i me my want to watch see read listen something some about on in of for and or with like would could please show give recommend suggest any new one that this is be have haven t not yet never again re tonight today now good great best what which can you do find me'.split(' '));

function askItems(){
  const items = [];
  for(const [path, {text}] of cache){
    if(!fileSha[path] || path === 'README.md') continue;
    const L = text.split('\n'); const heads = [];
    L.forEach((l, i) => {
      const h = l.match(HEAD);
      if(h){ heads.length = h[1].length - 1; heads[h[1].length - 1] = plain(h[2]); return; }
      const c = l.match(CHECK); if(!c) return;
      const t = plain(c[4]); if(!t || t.length < 3) return;

      let parent = ''; const ind0 = indentOf(l);
      if(ind0 > 0) for(let k = i - 1; k >= 0; k--){ const pl = L[k]; if(pl.trim() && indentOf(pl) < ind0 && BULLET.test(pl)){ parent = plain(pl.replace(/^\s*[-*+]\s+(\[[ xX]\]\s+)?/, '')); break; } if(HEAD.test(pl)) break; }
      items.push({id: items.length, path, i, title: t, done: c[3] !== ' ', heading: heads.filter(Boolean).join(' › '), parent, bold: /\*\*/.test(c[4])});

}
function askParse(q){
  const nq = ' ' + norm(q).replace(/[^\p{L}\p{N}\s'-]/gu, ' ') + ' ';
  const types = Object.keys(ASK_TYPES).filter(t => ASK_TYPES[t].words.some(w => nq.includes(' ' + w + ' ') || (w.includes(' ') && nq.includes(w))));
  const topics = Object.keys(ASK_TOPICS).filter(t => ASK_TOPICS[t].some(w => nq.includes(w.trim().length <= 3 ? ' ' + w.trim() + ' ' : norm(w))));
  const negated = /(haven'?t|have not|hasn'?t|not yet|never|didn'?t|unwatched|unread|unseen|new to me)/.test(nq);
  const wantDone = !negated && /\b(again|rewatch|re-watch|reread|re-read|already|watched|finished|done|favourite|favorite)\b/.test(nq);
  const status = /^(haven't|havent|watched|seen|read|finished|done|again|already|yet|unwatched|unread|listened)$/;
  const covered = new Set(types.flatMap(t => ASK_TYPES[t].words));
  const terms = nq.split(/\s+/).filter(w => w.length > 2 && !ASK_STOP.has(w) && !covered.has(w) && !status.test(w));

function askLocal(q){

    if(!T.paths.some(r => r.test(it.path))) return false;
    if(T.heading && /^watch\/russian/.test(it.path) && !T.heading.test(it.heading)) return false;
    if(T.notHeading && /^watch\/russian/.test(it.path) && T.notHeading.test(it.heading)) return false;

    const hay = ' ' + norm([it.title, it.parent, it.heading, it.path.replace(/[\/._-]/g, ' ')].join(' ')) + ' ';
    let s = 0; const why = [];
    for(const t of P.topics){
      const hit = ASK_TOPICS[t].some(w => hay.includes(w.trim().length <= 3 ? ' ' + norm(w.trim()) + ' ' : norm(w)));
      if(hit){ s += 3; why.push(t); } else s -= 4;
    }
    for(const w of P.terms) if(hay.includes(w)){ s += 2; why.push(w); }
    if(!P.topics.length && !P.terms.length) s += 1;

    if(it.bold) s += 0.5;
    if(it.parent && /^\d+[.:)]|part \d|episode|s\d\de\d/i.test(it.title)) s -= 0.7;
    if(P.short && /\b(\d{1,2}) ?min|short/i.test(it.title)) s += 1;
    scored.push({it, s: s + Math.random() * 0.8, why});
  }
  scored.sort((a, b) => b.s - a.s);
  const picks = [], perGroup = {};
  for(const x of scored){
    const g = x.it.path + '|' + (x.it.parent || x.it.heading);
    if((perGroup[g] = (perGroup[g] || 0) + 1) > 2) continue;
    picks.push(x); if(picks.length >= 8) break;
  }
  const what = [P.types.join(' / ') || 'anything', P.topics.length ? 'about ' + P.topics.join(', ') : '', P.terms.length ? '(' + P.terms.join(', ') + ')' : '', P.wantDone ? '— already done' : '— not done yet'].filter(Boolean).join(' ');
  return {intro: picks.length ? `Looking for ${what}. Here are ${picks.length} from your lists:` : `I couldn't find ${what} in your lists. Try other words, or add a Claude API key in Settings for smarter suggestions.`,
          picks: picks.map(x => ({path: x.it.path, i: x.it.i, ctx: x.it.parent || x.it.heading, why: x.why.length ? 'Matches: ' + [...new Set(x.why)].join(', ') : ''})), ideas: []};
}

async function askClaude(q){
  const P = askParse(q); let items = askItems();
  // keep the catalogue focused: preferred type first, then everything else, open items unless asked otherwise
  const pref = items.filter(it => !P.types.length || P.types.some(t => (ASK_TYPES[t].also && ASK_TYPES[t].also(it)) || ASK_TYPES[t].paths.some(r => r.test(it.path))));
  let pool = (pref.length ? pref : items).filter(it => P.wantDone || !it.done || /again|watched|read|done|finished|favou?rite/i.test(q));
  if(pool.length > 700){
    const loc = new Set(askLocal(q).picks.map(p => p.path + ':' + p.i));
    const hay = it => norm([it.title, it.parent, it.heading, it.path].join(' '));
    const qt = norm(q).split(/\s+/).filter(w => w.length > 2 && !ASK_STOP.has(w));
    pool = pool.map(it => ({it, s: (loc.has(it.path + ':' + it.i) ? 10 : 0) + qt.filter(w => hay(it).includes(w)).length + Math.random()}))
               .sort((a, b) => b.s - a.s).slice(0, 700).map(x => x.it);
  }
  const catalogue = pool.map(it => `${it.id}|${it.done ? 'done' : 'open'}|${it.path}|${it.heading}${it.parent ? ' › ' + it.parent : ''}|${it.title.slice(0, 140)}`).join('\n');
  const headings = {};
  for(const it of items){ (headings[it.path] = headings[it.path] || new Set()).add(it.heading.split(' › ').pop() || ''); }
  const targets = Object.entries(headings).filter(([p]) => /^(watch|books|intellectual|podcasts|courses)\//.test(p) && !/meetups/.test(p))
    .map(([p, hs]) => `${p}: ${[...hs].filter(Boolean).slice(0, 12).join(' | ')}`).join('\n');
  const sys = `You recommend things from the user's personal tracker lists (documentaries, films, series, books, podcasts, courses, practice material). The user is learning Russian, likes history, politics, Russia/Soviet culture, Turkish history, sci-fi and self-development.
Pick from the CATALOGUE (lines are id|status|file|section|title). Prefer "open" items unless the user asks for things already done. Pick items that truly fit the request; quality over quantity (3–8 picks).
You may also suggest up to 3 well-known real titles NOT in the catalogue that fit; for each give the best target file and section from TARGETS so it can be added there. Only suggest real works you are confident exist; include year and creator.
Reply with JSON only: {"intro": "one short sentence", "picks": [{"id": number, "why": "one short sentence"}], "ideas": [{"title": "Title, Year (Creator)", "why": "one short sentence", "file": "path", "section": "section name"}]}`;
  const r = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST', headers: {
      'x-api-key': cfg.anthropicKey, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: cfg.anthropicModel || 'claude-sonnet-5-5', max_tokens: 1500, system: sys,
      messages: [{role: 'user', content: `REQUEST: ${q}\n\nTARGETS:\n${targets}\n\nCATALOGUE:\n${catalogue}`}]})});
  if(!r.ok){ let m = r.status + ''; try{ m = (await r.json()).error.message; }catch(e){} throw new Error('Claude API: ' + m); }
  const data = await r.json();
  const txt = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  const j = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
  const byId = new Map(items.map(it => [it.id, it]));
  return {intro: j.intro || '', picks: (j.picks || []).map(p => byId.get(+p.id) && {path: byId.get(+p.id).path, i: byId.get(+p.id).i, ctx: byId.get(+p.id).parent || byId.get(+p.id).heading, why: p.why || ''}).filter(Boolean),
          ideas: (j.ideas || []).filter(x => x && x.title && cache.has(x.file))};
}

async function runAsk(q){
  q = (q || '').trim(); if(!q) return;
  askState = {q, busy: true, res: null, err: '', mode: cfg.anthropicKey ? 'claude' : 'basic'};
  view = 'ask'; render();
  try{
    await ensureIndex();
    askState.res = askState.mode === 'claude' ? await askClaude(q) : askLocal(q);
  }catch(e){
    askState.err = e.message;
    if(askState.mode === 'claude'){ askState.res = askLocal(q); askState.mode = 'basic'; }
  }
  askState.busy = false; if(view === 'ask') render();
}

const ASK_EXAMPLES = ['A documentary on Russia I haven’t watched', 'A Soviet comedy for tonight', 'Something about WWII', 'A sci-fi book', 'A short podcast episode on history', 'A series to binge', 'Something about Turkey'];
function renderAsk(m){
  const a = askState;
  let h = `<div class="doc askbox"><div class="askrow"><input id="askq" placeholder="What are you in the mood for? e.g. a documentary on Russia" value="${esc(a.q)}"><button class="primary" id="askGo">Ask</button><button id="askSurprise" title="Random pick">🎲</button></div>
    <div class="chips">${ASK_EXAMPLES.map(x => `<button class="chip" data-askex="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <div class="muted">${cfg.anthropicKey ? '✨ Using Claude — understands your request and can suggest new titles.' : 'Basic suggestions. Add a Claude API key in Settings for smarter, conversational suggestions and new ideas.'}</div></div>`;
  if(a.busy) h += `<div class="doc muted">${a.mode === 'claude' ? 'Asking Claude…' : 'Looking through your lists…'}</div>`;
  if(a.err) h += `<div class="doc" style="color:var(--danger)">${esc(a.err)}${a.mode === 'basic' ? ' — showing basic suggestions instead.' : ''}</div>`;
  if(a.res && !a.busy){
    h += `<p class="askintro">${esc(a.res.intro)}</p>`;
    for(const p of a.res.picks){
      const c0 = cache.get(p.path); if(!c0) continue;
      const line = c0.text.split('\n')[p.i] || '', c = line.match(CHECK); if(!c) continue;
      h += `<div class="card"><input type="checkbox" data-stoggle="${esc(p.path)}" data-ln="${p.i}" ${c[3] !== ' ' ? 'checked' : ''}>
        <div class="cb">${p.ctx ? `<div class="ctx2">${esc(p.ctx)}</div>` : ''}<div class="t">${inline(c[4], p.path)}</div>${p.why ? `<div class="why">${esc(p.why)}</div>` : ''}
        <a href="#" class="where" data-jump2="${esc(p.path)}" data-ln="${p.i}">${esc(p.path)} →</a></div></div>`;
    }
    if(a.res.ideas && a.res.ideas.length){
      h += `<h3 class="ideash">New ideas, not in your lists yet</h3>`;
      a.res.ideas.forEach((x, k) => {
        h += `<div class="card idea"><div class="cb"><div class="t"><b>${esc(x.title)}</b></div><div class="why">${esc(x.why || '')}</div>
          <button data-addidea="${k}">+ Add to ${esc(x.file)}${x.section ? ' › ' + esc(x.section) : ''}</button></div></div>`;
      });
    }
  }
  m.innerHTML = h;
  const inp = $('askq'); if(inp && !a.busy && !a.res) inp.focus();
}
async function addIdea(k){
  const x = askState.res.ideas[k]; const c0 = cache.get(x.file); if(!c0) return;
  cur = {path: x.file, text: c0.text, sha: c0.sha};
  const lines = L(); let hi = -1;
  if(x.section){ hi = lines.findIndex(l => { const h = l.match(HEAD); return h && plain(h[2]).toLowerCase() === x.section.toLowerCase(); }); }
  if(hi < 0) hi = lines.findIndex(l => /^##\s/.test(l));
  if(hi < 0) return toast('Could not find a place to add it.', null, true);
  const item = x.title.replace(/[\[\]]/g, '');
  askState.res.ideas.splice(k, 1);
  await commit(opAdd(lines[hi], occurrence(lines, hi), item, 'top'), `${name()}: add "${short(item)}" (suggested)`);
}

// ===== actions =====
async function loadList(){ setBusy(true); try{ files = await listFiles(); }catch(e){ toast(e.message, null, true); } setBusy(false); }
async function open(path, line){
  setBusy(true); addAt = editAt = null; view = 'file'; jumpLine = line == null ? null : line;
  path.split('/').slice(0, -1).forEach((_, i, a) => openDirs.add(a.slice(0, i + 1).join('/'))); saveOpen();
  try{ cur = {path, ...(await getFile(path))}; cache.set(path, {sha: cur.sha, text: cur.text}); fileSha[path] = cur.sha;
       try{ localStorage.setItem(KEY + '.last', path); }catch(e){} location.hash = ''; }
  catch(e){ toast(e.message, null, true); }
  setBusy(false); $('nav').classList.remove('open'); render();
  const target = jumpLine != null && document.querySelector(`main [data-line="${jumpLine}"]`);
  if(target){ target.scrollIntoView({block: 'center'}); target.classList.add('flash'); highlight(target, parseQuery(query).terms); }
  else window.scrollTo(0, 0);
  jumpLine = null;
}
const L = () => cur.text.split('\n');
const name = () => title(cur.path) === 'Overview' ? (cur.path.split('/').slice(-2, -1)[0] || 'README') : title(cur.path);

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-open],[data-askex],[data-jump2],[data-addidea],[data-more],[data-jump],[data-dir],[data-addat],[data-addgo],[data-edit],[data-save],[data-del],[data-cancel],button,a#reload');
  if(!el) return;
  if(el.dataset.open){ e.preventDefault(); return open(el.dataset.open); }
  if(el.dataset.askex){ return runAsk(el.dataset.askex); }
  if(el.dataset.jump2){ e.preventDefault(); return open(el.dataset.jump2, +el.dataset.ln); }
  if(el.dataset.addidea !== undefined){ return addIdea(+el.dataset.addidea); }
  if(el.dataset.more){ e.preventDefault(); expanded.add(el.dataset.more); return render(); }
  if(el.dataset.jump){ if(e.target.closest('a, input')) return; return open(el.dataset.jump, +el.dataset.ln); }
  if(el.dataset.dir){ const d = el.dataset.dir; openDirs.has(d) ? openDirs.delete(d) : openDirs.add(d); saveOpen(); return renderNav(); }
  if(el.dataset.addat !== undefined){ addAt = +el.dataset.addat; editAt = null; return render(); }
  if(el.dataset.cancel !== undefined){ addAt = editAt = null; return render(); }
  if(el.dataset.edit !== undefined){ editAt = +el.dataset.edit; addAt = null; return render(); }
  if(el.dataset.addgo !== undefined){
    const v = $('addText').value.trim(); if(!v) return;
    const i = +el.dataset.addgo, lines = L();
    const head = i >= 0 ? lines[i] : null, occ = i >= 0 ? occurrence(lines, i) : 0;
    const under = i >= 0 ? ' under ' + short(lines[i].replace(HEAD, '$2')) : '';
    return commit(opAdd(head, occ, v, $('addWhere').value), `${name()}: add "${short(v)}"${under}`);
  }
  if(el.dataset.save !== undefined){
    const i = +el.dataset.save, lines = L(), c = lines[i].match(CHECK), v = $('editText').value.trim();
    if(!v) return;
    return commit(opSet(lines[i], occurrence(lines, i), `${c[1]}${c[2]} [${c[3]}] ${v}`), `${name()}: edit "${short(v)}"`);
  }
  if(el.dataset.del !== undefined){
    if(!el.dataset.sure){ el.dataset.sure = 1; el.textContent = 'Tap again to delete'; return; }
    const i = +el.dataset.del, lines = L();
    return commit(opSet(lines[i], occurrence(lines, i), null), `${name()}: delete "${short(lines[i].match(CHECK)[4])}"`);
  }
  switch(el.id){
    case 'menuBtn': return $('nav').classList.toggle('open');
    case 'askBtn': if(!ready()) return; view = 'ask'; askState = {q: '', busy: false, res: null, err: '', mode: ''}; return render();
    case 'askGo': return runAsk($('askq').value);
    case 'askSurprise': return runAsk(['a documentary', 'a film', 'a book', 'a podcast episode', 'a series'][Math.floor(Math.random() * 5)] + ' I haven\'t done yet');
    case 'closeSearch': e.preventDefault(); $('q').value = ''; query = ''; view = lastView; return render();
    case 'settingsBtn': view = 'settings'; return render();
    case 'closeSettings': view = 'file'; return render();
    case 'forget': cfg.token = ''; store(); files = []; cur = null; return render();
    case 'reload': e.preventDefault(); await loadList(); return open(cur.path);
    case 'saveSettings':
      ['owner', 'repo', 'branch', 'token', 'anthropicKey', 'anthropicModel'].forEach(k => cfg[k] = $('s_' + k).value.trim());
      cfg.branch = cfg.branch || 'main';
      if(!ready()) return toast('Owner, repo and token are required.', null, true);
      store(); view = 'file'; cur = null;
      await loadList(); if(!files.length){ view = 'settings'; return render(); }
      toast('Connected'); return open(files.includes('README.md') ? 'README.md' : files[0]);
  }
});
document.addEventListener('change', e => {
  if(e.target.id === 'hideDone'){ cfg.hideDone = e.target.checked; store(); return render(); }
  if(e.target.dataset && e.target.dataset.stoggle){       // tick straight from search results
    const path = e.target.dataset.stoggle, i = +e.target.dataset.ln, c0 = cache.get(path);
    cur = {path, text: c0.text, sha: c0.sha};
    const lines = L(), c = lines[i].match(CHECK), nowDone = c[3] === ' ';
    return commit(opSet(lines[i], occurrence(lines, i), `${c[1]}${c[2]} [${nowDone ? 'x' : ' '}] ${c[4]}`), `${name()}: ${nowDone ? '✔' : 'reopen'} "${short(c[4])}"`);
  }
  const t = e.target.dataset && e.target.dataset.toggle; if(t === undefined) return;
  const i = +t, lines = L(), c = lines[i].match(CHECK), nowDone = c[3] === ' ';
  commit(opSet(lines[i], occurrence(lines, i), `${c[1]}${c[2]} [${nowDone ? 'x' : ' '}] ${c[4]}`), `${name()}: ${nowDone ? '✔' : 'reopen'} "${short(c[4])}"`);
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)){ e.preventDefault(); $('q').focus(); $('q').select(); return; }
  if(e.key === 'Escape' && e.target.id === 'q'){ $('q').value = ''; $('q').blur(); return runSearch(); }
  if(e.key === 'Escape'){ addAt = editAt = null; render(); }
  if(e.key !== 'Enter') return;
  if(e.target.id === 'addText') document.querySelector('[data-addgo]').click();
  if(e.target.id === 'editText') document.querySelector('[data-save]').click();
  if(e.target.id === 'askq') runAsk(e.target.value);
});
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 180); });
$('q').addEventListener('focus', () => { if(ready() && !indexing && cache.size < files.length) ensureIndex(); });
// Re-sync when you come back to the tab (picks up edits made directly on GitHub)
document.addEventListener('visibilitychange', async () => {
  if(document.hidden || !cur || view !== 'file' || addAt !== null || editAt !== null) return;
  try{ const f = await getFile(cur.path); if(f.sha !== cur.sha){ Object.assign(cur, f); render(); toast('Updated from GitHub'); } }catch(e){}
});

if(!/Mac|iPhone|iPad/.test(navigator.platform)) $('kbdHint').textContent = 'Ctrl K';
(async () => {
  if(!ready()) return render();
  await loadList();
  let last = null; try{ last = localStorage.getItem(KEY + '.last'); }catch(e){}
  if(files.length) return open(files.includes(last) ? last : (files.includes('README.md') ? 'README.md' : files[0]));
  render();
})();
</script>
